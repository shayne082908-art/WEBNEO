<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181817">
<link rel="manifest" href="./manifest.webmanifest">
<title>WEBNEO · Build 03</title>
<style>
:root{--bg:#181817;--panel:#232321;--paper:#f4efe3;--ink:#302d28;--soft:#989489;--line:#3b3934;--gold:#b99a5d;--danger:#b96e65}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eee;font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{height:58px;display:flex;align-items:center;gap:8px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(24,24,23,.96);z-index:20}
.brand{letter-spacing:.25em;font-weight:700}.brand small{letter-spacing:.08em;color:var(--soft);font-weight:500}.grow{flex:1}.btn,.icon{border:1px solid var(--line);background:var(--panel);color:#eee;border-radius:10px;min-height:38px;padding:0 12px}.icon{width:40px;padding:0}
.shelf{max-width:1120px;margin:auto;padding:34px 20px 80px}.intro{color:var(--soft);max-width:650px;margin:8px 0 30px}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:18px}.book{border:0;background:none;color:#eee;text-align:left}.cover{aspect-ratio:2/3;border-radius:7px;padding:18px 14px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,hsl(var(--h) 30% 44%),hsl(calc(var(--h) + 35) 28% 20%));box-shadow:0 16px 30px #0007}.cover b{font:600 22px/1.05 Georgia,serif}.cover span{font-size:11px;opacity:.8}.bookmeta{font-size:11px;color:var(--soft);margin-top:8px}.add .cover{border:1px dashed #59574f;background:transparent;align-items:center;justify-content:center;color:var(--soft);font-size:36px}
.editor{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.barTitle{max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.status{color:var(--soft);font-size:11px}
.workspace{overflow:auto;padding:26px 14px 100px}.paper{width:min(780px,100%);min-height:calc(100dvh - 160px);margin:auto;background:var(--paper);color:var(--ink);box-shadow:0 20px 60px #0006;padding:clamp(38px,7vw,70px);border-radius:4px}
.chapterTitle{font:600 12px/1.2 system-ui;text-transform:uppercase;letter-spacing:.2em;color:#8d8578;text-align:center;margin-bottom:42px;outline:none}
.manuscript{font:var(--size,20px)/1.78 Georgia,serif;outline:none;min-height:55vh}.manuscript p{margin:0;text-indent:1.4em}.manuscript p:first-child{text-indent:0}.manuscript.dropcap p:first-child:first-letter{float:left;font-size:3.4em;line-height:.78;padding:.11em .08em 0 0}.manuscript p.scene{text-align:center;text-indent:0;letter-spacing:.6em;color:#827b6e;margin:1.4em 0}.manuscript p.poetry{text-indent:0;margin:.8em 0 .8em 2.2em;font-style:italic}.mark{display:inline-grid;place-items:center;background:#e5ce94;color:#785416;border-radius:4px;font:700 10px system-ui;min-width:18px;height:18px;vertical-align:.15em}.anchor{display:inline-block;width:0;height:0;overflow:hidden}
.manuscript.focus>*{opacity:.17}.manuscript.focus>.active{opacity:1}.bottom{min-height:56px;border-top:1px solid var(--line);display:flex;align-items:center;gap:5px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));overflow:auto;background:#181817}.tab{border:0;background:transparent;color:var(--soft);min-height:38px;padding:0 11px;border-radius:9px;white-space:nowrap}.tab.on{background:#2b2924;color:#eee}.count{margin-left:auto;color:var(--soft);font-size:11px;white-space:nowrap}
.drawer{position:fixed;top:0;bottom:0;width:min(360px,88vw);background:#20201e;z-index:50;padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));box-shadow:0 0 40px #0008;overflow:auto}.left{left:0}.right{right:0}.drawer h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin:8px 8px 18px}.item{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:#eee;text-align:left;padding:12px;border-radius:8px}.item.on{background:#2c2b27}.item small{color:var(--soft)}.close{float:right}.sheetHead{display:flex;align-items:center;justify-content:space-between}
.aux{min-height:55vh;outline:none;font:18px/1.7 Georgia,serif}.card{border:1px solid #d7cfbf;border-radius:10px;padding:16px;margin:12px 0;background:#fbf8ef}.card blockquote{margin:0;white-space:pre-wrap;font:17px/1.6 Georgia,serif}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{max-width:120px}.goal{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{border:1px solid #d7cfbf;border-radius:10px;padding:18px}.metric b{display:block;font:30px Georgia,serif}.metric small{color:#887f72}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#282724;border:1px solid var(--line);padding:10px 14px;border-radius:999px;z-index:100}
@media(max-width:700px){.shelf{padding-top:22px}.paper{box-shadow:none;border-radius:0;min-height:100%;padding:44px 26px 110px}.workspace{padding:0 0 85px}.status{display:none}.goal{grid-template-columns:1fr}.barTitle{max-width:30vw}.count{display:none}}

/* Build 03 · Idea Forge */
.pinnedIdea{margin:0 0 32px;border:1px solid #d8c7a5;background:#fbf4e5;border-radius:10px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start}
.pinnedIdea>div:first-child{flex:1;min-width:0}.pinnedIdea small,.forgeBrief small,.forgeCard small,.savedSpark small{display:block;color:#8a7346;font:700 10px system-ui;letter-spacing:.14em;text-transform:uppercase}
.pinnedIdea p{margin:5px 0 0;color:#4b4336;font:14px/1.5 system-ui}.pinnedIdeaActions{display:flex;gap:5px}.pinnedIdeaActions button{min-height:30px;padding:0 8px;background:#f1e5cf;border-color:#dccbac;color:#51483a;font-size:11px}
.forgeHead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.forgeHead h2{margin:0;font:500 34px/1.1 Georgia,serif}.forgeHead p{color:#8d877a;max-width:520px;margin:8px 0 0;line-height:1.5}
.forgeControls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 0 14px}.forgeControls label{display:grid;gap:5px;color:#7e7568;font:700 9px system-ui;letter-spacing:.12em;text-transform:uppercase}.forgeControls select{min-height:40px;width:100%;border:1px solid #d8cebd;border-radius:8px;background:#fffdf8;color:#302b23;padding:0 9px}
.forgeBrief{border-left:3px solid #a9874e;background:#fbf7ee;padding:15px 17px;margin-bottom:12px}.forgeBrief p{margin:7px 0 0;font:18px/1.5 Georgia,serif}
.forgeGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.forgeCard{min-height:118px;border:1px solid #ddd4c4;border-radius:10px;background:#fffdf8;padding:13px 14px}.forgeCard.locked{border-color:#b79558;background:#fbf0db}.forgeCardHead{display:flex;justify-content:space-between;align-items:center}.forgeCardHead button{min-height:28px;width:30px;padding:0;border-radius:999px;background:transparent;border-color:transparent;color:#786b57}.forgeCard p{margin:10px 0 0;font:16px/1.45 Georgia,serif}
.forgeActions{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 30px}.forgeActions button,.savedSparkActions button,.forgeHead button{min-height:36px;background:#eee7d8;border-color:#d8cebc;color:#403a31}.forgeActions .primary,.forgeHead .primary{background:#393329;border-color:#393329;color:#f7f1e6}.forgeActions .practice{background:#856735;border-color:#856735;color:#fff8ed}
.savedSparks{border-top:1px solid #ddd3c2;padding-top:20px}.savedSparksHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.savedSparksHead b{font:700 10px system-ui;letter-spacing:.14em;text-transform:uppercase;color:#8a7346}.savedSparksHead span{font-size:11px;color:#91897c}.savedSparkList{display:grid;gap:8px}.savedSpark{border:1px solid #ddd4c4;border-radius:9px;background:#fbf8f0;padding:13px}.savedSpark p{margin:5px 0 11px;font:14px/1.45 Georgia,serif}.savedSparkActions{display:flex;gap:6px;flex-wrap:wrap}.savedSparkActions button{min-height:30px;padding:0 9px;font-size:11px}.savedSparkActions .danger{background:transparent;color:#8d564e}
@media(max-width:700px){.forgeHead{flex-direction:column}.forgeHead>button{width:100%}.forgeControls,.forgeGrid{grid-template-columns:1fr}.pinnedIdea{margin-top:-8px}.forgeActions button{flex:1 1 auto}}
</style>
</head>
<body>
<div id="app"></div>
<input id="importFile" type="file" accept=".json,application/json" hidden>
<script src="./idea-forge.js"></script>
<script>
(function(){
"use strict";
var KEY="webneo-build02-library";
var state={lib:null,view:"shelf",book:null,chapter:null,mode:"manuscript",drawer:null,savedRange:null,sprintTimer:null};

function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function strip(html){var d=document.createElement("div");d.innerHTML=html||"";d.querySelectorAll(".mark,.anchor,.scene").forEach(function(x){x.remove()});return d.textContent||""}
function wc(html){var t=strip(html).trim();return t?t.split(/\s+/).length:0}
function bookWords(b){return b.chapterOrder.reduce(function(n,id){return n+wc(b.chapters[id].html)},0)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fresh(){
 var bid=uid(),cid=uid();
 return {version:2,settings:{theme:"night"},shelves:[{id:"main",name:"Works in Progress",bookIds:[]}],books:{},created:new Date().toISOString()};
}
function makeBook(title){
 var id=uid(),ch=uid();
 return {id:id,title:title||"Untitled",author:"",goal:80000,dailyGoal:500,chapterOrder:[ch],chapters:{[ch]:{id:ch,title:"Chapter 1",html:"<p><br></p>"}},notes:"",outline:"",darlings:[],placeholders:[],ideaForge:forgeDefault(),view:{size:20,dropcap:true,focus:false,typewriter:false},days:{},lastChapter:ch,sprint:null};
}
function save(){localStorage.setItem(KEY,JSON.stringify(state.lib));document.querySelectorAll("[data-save]").forEach(function(x){x.textContent="Saved"})}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||"null");return x&&x.books?x:fresh()}catch(e){return fresh()}}
function currentBook(){return state.lib.books[state.book]}
function currentChapter(){var b=currentBook();return b&&b.chapters[state.chapter]}
function ensureDay(b){var k=today();if(!b.days[k])b.days[k]={start:bookWords(b)};return b.days[k]}
function todayWords(b){return Math.max(0,bookWords(b)-ensureDay(b).start)}
function toast(msg){var old=document.querySelector(".toast");if(old)old.remove();var t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},1900)}

function render(){
 document.documentElement.style.colorScheme=state.lib.settings.theme==="night"?"dark":"light";
 if(state.view==="editor")renderEditor();else renderShelf();
}
function renderShelf(){
 var books=state.lib.shelves[0].bookIds.map(function(id){return state.lib.books[id]}).filter(Boolean);
 document.getElementById("app").innerHTML='<div class="top"><div class="brand">WEBNEO <small>BUILD 03</small></div><div class="grow"></div><button class="btn" id="backup">Backup</button><button class="btn" id="restore">Restore</button><button class="icon" id="theme">◐</button></div><main class="shelf"><h1>Your bookshelf</h1><p class="intro">A browser-first writing chair inspired by NEO. Draft locally, work offline after first load, and keep the interface quiet until you need it.</p><div class="books">'+books.map(bookCard).join("")+'<button class="book add" id="addBook"><div class="cover">＋</div><div class="bookmeta">New book</div></button></div></main>';
 document.getElementById("addBook").onclick=function(){var title=prompt("Book title?","Untitled");if(title===null)return;var b=makeBook(title.trim()||"Untitled");state.lib.books[b.id]=b;state.lib.shelves[0].bookIds.push(b.id);save();openBook(b.id)};
 document.querySelectorAll("[data-book]").forEach(function(x){x.onclick=function(){openBook(x.dataset.book)}});
 document.getElementById("theme").onclick=function(){state.lib.settings.theme=state.lib.settings.theme==="night"?"paper":"night";save();document.body.style.filter=state.lib.settings.theme==="paper"?"invert(.92) hue-rotate(180deg)":""};
 document.getElementById("backup").onclick=backup;
 document.getElementById("restore").onclick=function(){document.getElementById("importFile").click()};
}
function bookCard(b){
 var words=bookWords(b),pct=Math.min(100,Math.round(words/Math.max(1,b.goal)*100)),h=[].slice.call(b.id).reduce(function(n,c){return n+c.charCodeAt(0)},0)%360;
 return '<button class="book" data-book="'+b.id+'"><div class="cover" style="--h:'+h+'"><b>'+esc(b.title)+'</b><span>'+esc(b.author||"Anonymous")+'</span></div><div class="bookmeta">'+words.toLocaleString()+' words · '+pct+'%</div></button>';
}
function openBook(id){state.book=id;var b=currentBook();ensureDay(b);state.chapter=b.lastChapter&&b.chapters[b.lastChapter]?b.lastChapter:b.chapterOrder[0];state.view="editor";state.mode="manuscript";state.drawer=null;render();setTimeout(focusEditor,0)}

function renderEditor(){
 var b=currentBook();ensureForge(b);var ch=currentChapter(),words=bookWords(b),cw=wc(ch.html),dw=todayWords(b);
 var aux=state.mode!=="manuscript";
 document.getElementById("app").innerHTML='<main class="editor"><header class="top"><button class="icon" id="home">←</button><button class="icon" id="chapters">☰</button><div class="barTitle">'+esc(b.title)+'</div><div class="grow"></div><span class="status" data-save>Saved</span><button class="icon" id="darling" title="Keep selected text">♡</button><button class="icon" id="placeholder" title="Placeholder">◆</button><button class="icon" id="format">Aa</button></header><section class="workspace"><div class="paper">'+(aux?auxView(b):manuscriptView(b,ch))+'</div></section><footer class="bottom"><button class="tab '+(state.mode==="manuscript"?"on":"")+'" data-mode="manuscript">Manuscript</button><button class="tab '+(state.mode==="forge"?"on":"")+'" data-mode="forge">Idea Forge</button><button class="tab '+(state.mode==="notes"?"on":"")+'" data-mode="notes">Notes</button><button class="tab '+(state.mode==="outline"?"on":"")+'" data-mode="outline">Outline</button><button class="tab '+(state.mode==="darlings"?"on":"")+'" data-mode="darlings">Darlings</button><button class="tab '+(state.mode==="goals"?"on":"")+'" data-mode="goals">Goals</button><span class="count">'+cw+' chapter · '+words+' book · '+dw+'/'+b.dailyGoal+' today</span></footer></main>'+drawerView(b);
 bindEditor();
 if(b.sprint&&b.sprint.active)startSprintTicker();
}
function manuscriptView(b,ch){
 return renderPinnedForge(b)+'<div class="chapterTitle" contenteditable="true" id="chapterTitle">'+esc(ch.title)+'</div><div id="manuscript" class="manuscript '+(b.view.dropcap?"dropcap ":"")+(b.view.focus?"focus ":"")+'" style="--size:'+b.view.size+'px" contenteditable="true" spellcheck="false">'+ch.html+'</div>';
}
function auxView(b){
 if(state.mode==="forge")return forgeView(b);
 if(state.mode==="notes"||state.mode==="outline")return '<h2>'+state.mode[0].toUpperCase()+state.mode.slice(1)+'</h2><p style="color:#8d8578">Private working space for this book.</p><div id="aux" class="aux" contenteditable="true">'+(state.mode==="notes"?b.notes:b.outline)+'</div>';
 if(state.mode==="darlings")return '<h2>Darlings</h2><p style="color:#8d8578">Beautiful bits you removed without losing them.</p>'+(b.darlings.length?b.darlings.map(function(d){return '<div class="card"><blockquote>'+esc(strip(d.html))+'</blockquote><div class="row" style="margin-top:12px"><button class="btn" data-restore-d="'+d.id+'">Restore</button><button class="btn" data-delete-d="'+d.id+'">Delete</button></div></div>'}).join(""):'<p>No bodies in the basement yet.</p>');
 var sprint=b.sprint&&b.sprint.active;
 return '<h2>Momentum</h2><div class="goal"><div class="metric"><small>Today</small><b>'+todayWords(b)+'</b><div class="row">Goal <input id="dailyGoal" type="number" value="'+b.dailyGoal+'"></div></div><div class="metric"><small>Book</small><b>'+bookWords(b)+'</b><div class="row">Goal <input id="bookGoal" type="number" value="'+b.goal+'"></div></div></div><div class="card"><h3>Word sprint</h3><p id="sprintStatus">'+(sprint?sprintText(b):'Pick a timer and write without negotiating with yourself.')+'</p><div class="row">'+(sprint?'<button class="btn" id="endSprint">End sprint</button>':'<button class="btn" data-sprint="10">10 min</button><button class="btn" data-sprint="20">20 min</button><button class="btn" data-sprint="30">30 min</button>')+'</div></div>';
}
function drawerView(b){
 if(state.drawer==="chapters")return '<aside class="drawer left"><div class="sheetHead"><h3>Chapters</h3><button class="icon close" data-close>×</button></div>'+b.chapterOrder.map(function(id,i){var c=b.chapters[id];var dot=b.placeholders.some(function(p){return !p.resolved&&p.chapter===id})?' •':'';return '<button class="item '+(id===state.chapter?"on":"")+'" data-ch="'+id+'">'+esc(c.title||("Chapter "+(i+1)))+dot+'<br><small>'+wc(c.html)+' words</small></button>'}).join("")+'<button class="btn" id="newChapter" style="margin-top:12px">+ New chapter</button></aside>';
 if(state.drawer==="placeholders")return '<aside class="drawer right"><div class="sheetHead"><h3>Placeholders</h3><button class="icon close" data-close>×</button></div>'+(b.placeholders.filter(function(p){return !p.resolved}).map(function(p){return '<div class="card"><b>'+esc(p.note||"Return here")+'</b><div class="row" style="margin-top:10px"><button class="btn" data-jump-p="'+p.id+'">Jump</button><button class="btn" data-resolve-p="'+p.id+'">Resolve</button></div></div>'}).join("")||'<p>No open placeholders.</p>')+'</aside>';
 if(state.drawer==="format")return '<aside class="drawer right"><div class="sheetHead"><h3>Writing view</h3><button class="icon close" data-close>×</button></div><div class="card"><label>Text size <input id="fontSize" type="range" min="16" max="28" value="'+b.view.size+'"></label></div><div class="card"><label><input id="dropcap" type="checkbox" '+(b.view.dropcap?"checked":"")+'> Drop cap</label></div><div class="card"><label><input id="focusMode" type="checkbox" '+(b.view.focus?"checked":"")+'> Focus paragraph</label></div><div class="card"><label><input id="typewriter" type="checkbox" '+(b.view.typewriter?"checked":"")+'> Typewriter scrolling</label></div><p style="color:#8d8578">Shift+Enter creates a poetry paragraph. Enter twice makes a scene break. Enter three times starts a new chapter.</p></aside>';
 return "";
}
function bindEditor(){
 var b=currentBook(),ch=currentChapter(),m=document.getElementById("manuscript");
 document.getElementById("home").onclick=function(){stopSprintTicker();state.view="shelf";save();render()};
 document.getElementById("chapters").onclick=function(){state.drawer=state.drawer==="chapters"?null:"chapters";renderEditor()};
 document.getElementById("placeholder").onclick=function(){if(state.mode==="manuscript")insertPlaceholder();else{state.drawer="placeholders";renderEditor()}};
 document.getElementById("format").onclick=function(){state.drawer=state.drawer==="format"?null:"format";renderEditor()};
 document.getElementById("darling").onclick=function(){saveDarling()};
 document.querySelectorAll("[data-mode]").forEach(function(x){x.onclick=function(){state.mode=x.dataset.mode;state.drawer=null;renderEditor()}});
 document.querySelectorAll("[data-close]").forEach(function(x){x.onclick=function(){state.drawer=null;renderEditor()}});
 document.querySelectorAll("[data-ch]").forEach(function(x){x.onclick=function(){state.chapter=x.dataset.ch;b.lastChapter=state.chapter;state.drawer=null;state.mode="manuscript";save();renderEditor()}});
 var nc=document.getElementById("newChapter");if(nc)nc.onclick=function(){newChapter(b)};
 var ct=document.getElementById("chapterTitle");if(ct)ct.oninput=function(){ch.title=ct.textContent.trim()||"Untitled chapter";save()};
 var aux=document.getElementById("aux");if(aux)aux.oninput=function(){if(state.mode==="notes")b.notes=aux.innerHTML;else b.outline=aux.innerHTML;save()};
 if(m){
   m.addEventListener("input",function(){ch.html=m.innerHTML;smartPunctuation(m);ch.html=m.innerHTML;save();refreshActive(m);if(b.view.typewriter)scrollCaret()});
   m.addEventListener("keydown",function(e){if(e.key==="Enter")handleEnter(e,m,b);if(e.key==="Enter"&&e.shiftKey)handlePoetry(e,m)});
   m.addEventListener("keyup",function(){rememberRange(m);refreshActive(m)});m.addEventListener("mouseup",function(){rememberRange(m);refreshActive(m)});m.addEventListener("touchend",function(){setTimeout(function(){rememberRange(m)},0)});
   m.addEventListener("click",function(e){if(e.target.classList.contains("mark")){state.drawer="placeholders";renderEditor()}});
   refreshActive(m);
 }
 var fs=document.getElementById("fontSize");if(fs)fs.oninput=function(){b.view.size=+fs.value;save();renderEditor()};
 var dc=document.getElementById("dropcap");if(dc)dc.onchange=function(){b.view.dropcap=dc.checked;save();renderEditor()};
 var fm=document.getElementById("focusMode");if(fm)fm.onchange=function(){b.view.focus=fm.checked;save();renderEditor()};
 var tw=document.getElementById("typewriter");if(tw)tw.onchange=function(){b.view.typewriter=tw.checked;save();renderEditor()};
 var dg=document.getElementById("dailyGoal");if(dg)dg.onchange=function(){b.dailyGoal=Math.max(1,+dg.value||1);save();renderEditor()};
 var bg=document.getElementById("bookGoal");if(bg)bg.onchange=function(){b.goal=Math.max(1,+bg.value||1);save();renderEditor()};
 document.querySelectorAll("[data-sprint]").forEach(function(x){x.onclick=function(){startSprint(b,+x.dataset.sprint)}});
 var es=document.getElementById("endSprint");if(es)es.onclick=function(){endSprint(b,false)};
 document.querySelectorAll("[data-restore-d]").forEach(function(x){x.onclick=function(){restoreDarling(b,x.dataset.restoreD)}});
 document.querySelectorAll("[data-delete-d]").forEach(function(x){x.onclick=function(){deleteDarling(b,x.dataset.deleteD)}});
 document.querySelectorAll("[data-jump-p]").forEach(function(x){x.onclick=function(){jumpPlaceholder(b,x.dataset.jumpP)}});
 document.querySelectorAll("[data-resolve-p]").forEach(function(x){x.onclick=function(){resolvePlaceholder(b,x.dataset.resolveP)}});
}

function forgeClone(x){return JSON.parse(JSON.stringify(x))}
function forgeDefault(){return WEBNEO_FORGE.createState({})}
function ensureForge(b){
 b.ideaForge=WEBNEO_FORGE.createState(b.ideaForge);
 if(!b.ideaForge.current)b.ideaForge=WEBNEO_FORGE.generate(b.ideaForge,true);
 return b.ideaForge;
}
function forgeOpts(list,current,labelKey){
 return list.map(function(x){var v=labelKey?x[labelKey]:x;var l=labelKey?x.label:x;return '<option value="'+esc(v)+'" '+(current===v?'selected':'')+'>'+esc(l)+'</option>'}).join('');
}
function renderPinnedForge(b){
 var f=ensureForge(b),i=f.pinned;if(!i)return '';
 return '<div class="pinnedIdea"><div><small>Practice prompt</small><p>'+esc(i.brief)+'</p></div><div class="pinnedIdeaActions"><button data-open-forge>Forge</button><button data-clear-forge aria-label="Dismiss prompt">×</button></div></div>';
}
function savedForgeCard(i){
 return '<div class="savedSpark"><small>'+esc((WEBNEO_FORGE.modes.find(function(m){return m.id===i.mode})||{label:"Spark"}).label)+'</small><p>'+esc(i.brief)+'</p><div class="savedSparkActions"><button data-pin-spark="'+i.id+'">Pin</button><button data-copy-spark="'+i.id+'">Copy</button><button class="danger" data-delete-spark="'+i.id+'">Delete</button></div></div>';
}
function forgeView(b){
 var f=ensureForge(b),i=f.current,slots=WEBNEO_FORGE.slots(f.mode);
 return '<div class="forgeHead"><div><small class="aux-eyebrow">IDEA FORGE · OFFLINE</small><h2>'+esc(i.title)+'</h2><p>Lock the pieces you like, reroll the rest, then pin the spark above your manuscript. No AI or internet required.</p></div><button class="primary" id="forgeReroll">Reroll unlocked</button></div>'+
 '<div class="forgeControls"><label>Exercise<select data-forge-setting="mode">'+forgeOpts(WEBNEO_FORGE.modes,f.mode,"id")+'</select></label><label>Genre<select data-forge-setting="genre">'+forgeOpts(WEBNEO_FORGE.genres,f.genre)+'</select></label><label>Mood<select data-forge-setting="mood">'+forgeOpts(WEBNEO_FORGE.moods,f.mood)+'</select></label></div>'+
 '<div class="forgeBrief"><small>Writing brief</small><p>'+esc(i.brief)+'</p></div>'+
 '<div class="forgeGrid">'+slots.map(function(sl){return '<div class="forgeCard '+(f.locks[sl.key]?'locked':'')+'"><div class="forgeCardHead"><small>'+esc(sl.label)+'</small><button data-forge-lock="'+sl.key+'" aria-label="Lock or unlock '+esc(sl.label)+'">'+(f.locks[sl.key]?'🔒':'○')+'</button></div><p>'+esc(i.values[sl.key]||"")+'</p></div>'}).join('')+'</div>'+
 '<div class="forgeActions"><button id="forgeNew">New spark</button><button id="forgeUnlock">Unlock all</button><button id="forgeCopy">Copy</button><button id="forgeSave">Save spark</button><button class="primary" id="forgePin">Pin to manuscript</button><button class="practice" id="forgePractice">Start 15-min practice</button></div>'+
 '<div class="savedSparks"><div class="savedSparksHead"><b>Saved sparks</b><span>'+(f.saved.length?f.saved.length+" kept":"Keep the ones that bite.")+'</span></div>'+(f.saved.length?'<div class="savedSparkList">'+f.saved.map(savedForgeCard).join('')+'</div>':'<div class="large-empty">Nothing saved yet.</div>')+'</div>';
}
function forgeFind(b,id){return ensureForge(b).saved.find(function(x){return x.id===id})}
function forgeReroll(b,fresh){var f=ensureForge(b);if(fresh)f.locks={};b.ideaForge=WEBNEO_FORGE.generate(f,!!fresh);save();renderEditor();toast(fresh?"Fresh spark forged.":"Unlocked pieces rerolled.")}
function forgeCopy(i){if(!i)return;var t=WEBNEO_FORGE.asText(i);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast("Prompt copied.")}).catch(function(){forgeCopyFallback(t)});else forgeCopyFallback(t)}
function forgeCopyFallback(t){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Prompt copied.")}finally{a.remove()}}
function forgePin(b,i){if(!i)return;ensureForge(b);b.ideaForge.pinned=forgeClone(i);state.mode="manuscript";save();renderEditor();setTimeout(focusEditor,0);toast("Prompt pinned above the draft.")}
function bindForgeEvents(b){
 document.querySelectorAll("[data-forge-setting]").forEach(function(el){el.onchange=function(){var f=ensureForge(b),k=el.dataset.forgeSetting;f[k]=el.value;if(k==="mode")f.locks={};b.ideaForge=WEBNEO_FORGE.generate(f,k==="mode");save();renderEditor()}});
 document.querySelectorAll("[data-forge-lock]").forEach(function(el){el.onclick=function(){var f=ensureForge(b),k=el.dataset.forgeLock;f.locks[k]=!f.locks[k];b.ideaForge=f;save();renderEditor()}});
 var rr=document.getElementById("forgeReroll");if(rr)rr.onclick=function(){forgeReroll(b,false)};
 var nn=document.getElementById("forgeNew");if(nn)nn.onclick=function(){forgeReroll(b,true)};
 var uu=document.getElementById("forgeUnlock");if(uu)uu.onclick=function(){var f=ensureForge(b);f.locks={};b.ideaForge=f;save();renderEditor()};
 var cc=document.getElementById("forgeCopy");if(cc)cc.onclick=function(){forgeCopy(ensureForge(b).current)};
 var ss=document.getElementById("forgeSave");if(ss)ss.onclick=function(){var f=ensureForge(b),i=f.current;if(!f.saved.some(function(x){return x.id===i.id}))f.saved.unshift(forgeClone(i));f.saved=f.saved.slice(0,50);b.ideaForge=f;save();renderEditor();toast("Spark saved.")};
 var pp=document.getElementById("forgePin");if(pp)pp.onclick=function(){forgePin(b,ensureForge(b).current)};
 var pr=document.getElementById("forgePractice");if(pr)pr.onclick=function(){var f=ensureForge(b);f.pinned=forgeClone(f.current);b.ideaForge=f;save();startSprint(b,15);toast("15-minute practice started.")};
 document.querySelectorAll("[data-pin-spark]").forEach(function(el){el.onclick=function(){forgePin(b,forgeFind(b,el.dataset.pinSpark))}});
 document.querySelectorAll("[data-copy-spark]").forEach(function(el){el.onclick=function(){forgeCopy(forgeFind(b,el.dataset.copySpark))}});
 document.querySelectorAll("[data-delete-spark]").forEach(function(el){el.onclick=function(){var f=ensureForge(b);f.saved=f.saved.filter(function(x){return x.id!==el.dataset.deleteSpark});b.ideaForge=f;save();renderEditor()}});
 document.querySelectorAll("[data-open-forge]").forEach(function(el){el.onclick=function(){state.mode="forge";renderEditor()}});
 document.querySelectorAll("[data-clear-forge]").forEach(function(el){el.onclick=function(){var f=ensureForge(b);f.pinned=null;b.ideaForge=f;save();renderEditor();toast("Prompt unpinned.")}});
 bindForgeEvents(b);
}

function focusEditor(){var m=document.getElementById("manuscript");if(m)m.focus()}
function block(node,root){while(node&&node!==root){if(node.nodeType===1&&/^(P|DIV)$/.test(node.tagName))return node;node=node.parentNode}return null}
function currentBlock(root){var s=getSelection();return s&&s.rangeCount?block(s.anchorNode,root):null}
function refreshActive(root){root.querySelectorAll(".active").forEach(function(x){x.classList.remove("active")});var b=currentBlock(root);if(b)b.classList.add("active")}
function rememberRange(root){var s=getSelection();if(s&&s.rangeCount&&root.contains(s.anchorNode))state.savedRange=s.getRangeAt(0).cloneRange()}
function handlePoetry(e,root){e.preventDefault();document.execCommand("insertParagraph");var b=currentBlock(root);if(b)b.classList.add("poetry")}
function handleEnter(e,root,b){
 if(e.shiftKey)return;
 var cur=currentBlock(root);if(!cur)return;
 var empty=!cur.textContent.trim()&&!cur.querySelector(".mark");
 if(empty&&cur.previousElementSibling&&cur.previousElementSibling.classList.contains("scene")){e.preventDefault();newChapter(b);return}
 if(empty){e.preventDefault();cur.className="scene";cur.contentEditable="false";cur.textContent="***";var p=document.createElement("p");p.innerHTML="<br>";cur.after(p);placeCaret(p);currentChapter().html=root.innerHTML;save();return}
}
function newChapter(b){var id=uid(),n=b.chapterOrder.length+1;b.chapterOrder.push(id);b.chapters[id]={id:id,title:"Chapter "+n,html:"<p><br></p>"};b.lastChapter=id;state.chapter=id;state.mode="manuscript";state.drawer=null;save();renderEditor();setTimeout(focusEditor,0);toast("Chapter "+n+". Keep going.")}
function placeCaret(node){var r=document.createRange();r.selectNodeContents(node);r.collapse(true);var s=getSelection();s.removeAllRanges();s.addRange(r);node.scrollIntoView({block:"center"})}
function smartPunctuation(root){
 var s=getSelection();if(!s||!s.rangeCount)return;var n=s.anchorNode;if(!n||n.nodeType!==3||!root.contains(n))return;
 var off=s.anchorOffset,t=n.data,before=t.slice(0,off),after=t.slice(off),next=before;
 next=next.replace(/--$/,"—").replace(/\.\.\.$/,"…");
 next=next.replace(/(^|[\s([{])"([^"]*)$/,'$1“$2').replace(/"$/,"”");
 next=next.replace(/(^|[\s([{])'([^']*)$/,"$1‘$2").replace(/([A-Za-z])'([A-Za-z])$/,"$1’$2");
 if(next!==before){n.data=next+after;var delta=next.length-before.length;var r=document.createRange();r.setStart(n,Math.max(0,off+delta));r.collapse(true);s.removeAllRanges();s.addRange(r)}
}
function insertPlaceholder(){
 var m=document.getElementById("manuscript"),b=currentBook();if(!m)return;var s=getSelection();if(!s||!s.rangeCount||!m.contains(s.anchorNode)){toast("Tap where you want the placeholder first.");return}
 var note=prompt("What should you come back to?","Look this up");if(note===null)return;var id=uid(),mark=document.createElement("span");mark.className="mark";mark.contentEditable="false";mark.dataset.placeholder=id;mark.textContent="◆";var r=s.getRangeAt(0);r.collapse(true);r.insertNode(mark);r.setStartAfter(mark);r.collapse(true);s.removeAllRanges();s.addRange(r);b.placeholders.push({id:id,chapter:state.chapter,note:note||"Return here",resolved:false});currentChapter().html=m.innerHTML;save();toast("Placeholder dropped. Keep moving.")}
function resolvePlaceholder(b,id){var p=b.placeholders.find(function(x){return x.id===id});if(!p)return;var ch=b.chapters[p.chapter],d=document.createElement("div");d.innerHTML=ch.html;var m=d.querySelector('[data-placeholder="'+id+'"]');if(m)m.remove();ch.html=d.innerHTML;p.resolved=true;save();state.drawer=null;renderEditor()}
function jumpPlaceholder(b,id){var p=b.placeholders.find(function(x){return x.id===id});if(!p)return;state.chapter=p.chapter;b.lastChapter=p.chapter;state.mode="manuscript";state.drawer=null;renderEditor();setTimeout(function(){var m=document.querySelector('[data-placeholder="'+id+'"]');if(m)m.scrollIntoView({behavior:"smooth",block:"center"})},0)}
function saveDarling(){
 var m=document.getElementById("manuscript"),b=currentBook(),s=getSelection();if(!m){toast("Select manuscript text first.");return}
 var r=state.savedRange&&m.contains(state.savedRange.commonAncestorContainer)?state.savedRange:(s&&s.rangeCount?s.getRangeAt(0):null);if(!r||r.collapsed||!m.contains(r.commonAncestorContainer)){toast("Select a passage first.");return}
 var id=uid(),frag=r.extractContents(),box=document.createElement("div");box.appendChild(frag.cloneNode(true));if(!strip(box.innerHTML).trim())return;
 var a=document.createElement("span");a.className="anchor";a.dataset.anchor=id;a.contentEditable="false";r.insertNode(a);b.darlings.unshift({id:id,chapter:state.chapter,html:box.innerHTML});currentChapter().html=m.innerHTML;save();renderEditor();toast("Darling kept.")}
function restoreDarling(b,id){var i=b.darlings.findIndex(function(x){return x.id===id});if(i<0)return;var d=b.darlings[i],ch=b.chapters[d.chapter],box=document.createElement("div");box.innerHTML=ch.html;var a=box.querySelector('[data-anchor="'+id+'"]');if(a){var t=document.createElement("template");t.innerHTML=d.html;a.replaceWith(t.content)}else box.insertAdjacentHTML("beforeend",d.html);ch.html=box.innerHTML;b.darlings.splice(i,1);state.chapter=d.chapter;state.mode="manuscript";save();renderEditor();toast("Darling restored.")}
function deleteDarling(b,id){if(!confirm("Discard this Darling permanently?"))return;var d=b.darlings.find(function(x){return x.id===id});if(d){var ch=b.chapters[d.chapter],box=document.createElement("div");box.innerHTML=ch.html;var a=box.querySelector('[data-anchor="'+id+'"]');if(a)a.remove();ch.html=box.innerHTML}b.darlings=b.darlings.filter(function(x){return x.id!==id});save();renderEditor()}
function scrollCaret(){var s=getSelection();if(!s||!s.rangeCount)return;var rect=s.getRangeAt(0).getBoundingClientRect();var sc=document.querySelector(".workspace");if(sc&&rect.top)sc.scrollBy({top:rect.top-innerHeight*.47,behavior:"smooth"})}
function startSprint(b,min){b.sprint={active:true,start:Date.now(),duration:min,startWords:bookWords(b)};save();state.mode="manuscript";renderEditor();toast(min+"-minute sprint started.")}
function sprintText(b){var end=b.sprint.start+b.sprint.duration*60000,left=Math.max(0,end-Date.now()),mm=Math.floor(left/60000),ss=Math.floor(left%60000/1000),words=Math.max(0,bookWords(b)-b.sprint.startWords);return String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0")+" · "+words+" words"}
function startSprintTicker(){stopSprintTicker();state.sprintTimer=setInterval(function(){var b=currentBook();if(!b||!b.sprint||!b.sprint.active)return;var end=b.sprint.start+b.sprint.duration*60000;if(Date.now()>=end){endSprint(b,true);return}var el=document.getElementById("sprintStatus");if(el)el.textContent=sprintText(b)},1000)}
function stopSprintTicker(){if(state.sprintTimer)clearInterval(state.sprintTimer);state.sprintTimer=null}
function endSprint(b,done){var words=Math.max(0,bookWords(b)-b.sprint.startWords);b.sprint.active=false;b.sprint.words=words;save();stopSprintTicker();renderEditor();toast((done?"Sprint complete · ":"Sprint ended · ")+words+" words.")}
function backup(){var blob=new Blob([JSON.stringify(state.lib,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="WEBNEO-backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href)}
document.getElementById("importFile").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.books)throw Error();state.lib=x;save();state.view="shelf";render();toast("Backup restored.")}catch(err){alert("That does not look like a WEBNEO backup.")}};r.readAsText(f);e.target.value=""});
state.lib=load();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});
})();
</script>
